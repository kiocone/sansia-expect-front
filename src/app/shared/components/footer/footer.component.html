<footer class="text-white" style="background-color: #caced1;">
  <!-- Grid container -->
  <div>
    <div class="social-section">
      <!-- Section: Social media -->
      <section class="container-redes mb-4 redes">
        
        <a mdbRipple class="btn btn-outline-light btn-floating m-1" href="#!" role="button">
          <i class="fab fa-instagram fa-2x" style="color: #ac2bac;"></i>
        </a>
        
        <a mdbRipple class="btn btn-outline-light btn-floating m-1" href="https://google.com" role="button">
          <i class="fab fa-whatsapp fa-2x" style="color: #25d366;"></i>
        </a>
        
        <a mdbRipple class="btn btn-outline-light btn-floating m-1" href="#!" role="button">
          <i class="fab fa-facebook-f fa-2x" style="color: #3b5998;"></i>
        </a>
      </section>
    </div>
    <!-- Section: Images -->
    <section class="references">
      <div class="row">
        @for (image of smallImages; track image) { 
          <div
            mdbRipple
            rippleColor="light"
            class="bg-image hover-overlay ripple shadow-1-strong rounded"
          >
            <img
              src="{{image}}"
              class="w-100"
            />
            <a href="#!">
              <div
                class="mask"
                style="background-color: rgba(251, 251, 251, 0.2);"
              ></div>
            </a>
          </div>
        }
      </div>
    </section>
    <!-- Section: Images -->
  </div>
  <!-- Grid container -->

  <!-- Copyright -->
  <div class="text-center">
    © {{year}} Copyright
  </div>
  <!-- Copyright -->
</footer>
