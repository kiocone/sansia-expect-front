@if (tarjetaData.enabled === true) {
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{tarjetaData.title}}</mat-card-title>
      <mat-card-subtitle>{{tarjetaData.subtitle}}</mat-card-subtitle>
    </mat-card-header>
    <img
      mat-card-image
      src="{{tarjetaData.background_image}}"
      alt="{{tarjetaData.subtitle}}">
    <mat-card-content>
      <p>
        {{tarjetaData.description}}
      </p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-flat-button color="primary">{{tarjetaData.button_text}}</button>
    </mat-card-actions>
  </mat-card>
}
